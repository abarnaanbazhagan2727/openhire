<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Post a new job opportunity on OpenHire to reach verified technical candidates.">
  <title>Post a Job - OpenHire</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">OH</div>
        <span>OpenHire</span>
      </a>

      <div class="nav-actions">
        <!-- Injected via ui.js -->
      </div>
    </div>
  </header>

  <main style="padding: 3rem 0;">
    <div class="container" style="max-width: 820px;">
      <div class="card">
        <div style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
          <h1 style="font-size: 1.75rem; margin-bottom: 0.25rem;">Create New Job Listing</h1>
          <p class="text-secondary">Publish an open position to thousands of prospective candidates.</p>
        </div>

        <form id="postJobForm">
          <div class="form-group">
            <label class="form-label" for="jobTitle">Job Title *</label>
            <input type="text" id="jobTitle" class="form-input" placeholder="e.g. Senior Full Stack Engineer (Node.js / React)" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="jobCategory">Domain / Category *</label>
              <select id="jobCategory" class="form-input" required>
                <option value="">Select Domain Category</option>
                <option value="Software Development">Software Development</option>
                <option value="Data Science">Data Science</option>
                <option value="Artificial Intelligence">Artificial Intelligence</option>
                <option value="Cybersecurity">Cybersecurity</option>
                <option value="Cloud Computing">Cloud Computing</option>
                <option value="UI/UX Design">UI/UX Design</option>
                <option value="Marketing">Marketing</option>
                <option value="Finance">Finance</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="jobCompany">Company Name *</label>
              <input type="text" id="jobCompany" class="form-input" placeholder="e.g. TechNova Solutions" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="jobLocation">Location *</label>
              <input type="text" id="jobLocation" class="form-input" placeholder="e.g. Bangalore, India" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="jobWorkMode">Work Mode *</label>
              <select id="jobWorkMode" class="form-input" required>
                <option value="On-site">On-site</option>
                <option value="Hybrid">Hybrid</option>
                <option value="Remote">Remote</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="jobType">Employment Type *</label>
              <select id="jobType" class="form-input" required>
                <option value="Full Time">Full Time</option>
                <option value="Part Time">Part Time</option>
                <option value="Internship">Internship</option>
                <option value="Contract">Contract</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="jobExperience">Experience Level *</label>
              <select id="jobExperience" class="form-input" required>
                <option value="Fresher">Fresher / Graduate</option>
                <option value="1-3 Years">1 - 3 Years</option>
                <option value="3-5 Years">3 - 5 Years</option>
                <option value="5+ Years">5+ Years</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="jobSalaryMin">Minimum Salary (₹ / month)</label>
              <input type="number" id="jobSalaryMin" class="form-input" placeholder="e.g. 50000" min="0">
            </div>

            <div class="form-group">
              <label class="form-label" for="jobSalaryMax">Maximum Salary (₹ / month)</label>
              <input type="number" id="jobSalaryMax" class="form-input" placeholder="e.g. 90000" min="0">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="jobDeadline">Application Deadline *</label>
              <input type="date" id="jobDeadline" class="form-input" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="jobSkills">Required Skills (comma-separated)</label>
              <input type="text" id="jobSkills" class="form-input" placeholder="JavaScript, Node.js, Express, MongoDB, REST">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="jobDescription">Job Overview & Description *</label>
            <textarea id="jobDescription" class="form-input" rows="4" placeholder="Detail the role purpose, team structure, and impact..." required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="jobResponsibilities">Key Responsibilities (one per line)</label>
            <textarea id="jobResponsibilities" class="form-input" rows="4" placeholder="Design scalable backend microservices&#10;Write integration unit tests&#10;Optimize database query performance"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="jobRequirements">Candidate Requirements (one per line)</label>
            <textarea id="jobRequirements" class="form-input" rows="4" placeholder="Proficiency in modern JavaScript and Node.js&#10;Experience with NoSQL databases (MongoDB)&#10;Familiarity with containerized deployments"></textarea>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
            <a href="employer-dashboard.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" id="publishJobSubmitBtn">Publish Job</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = API.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      if (user.role !== 'employer') {
        UI.showToast('Only verified employer accounts can publish job listings.', 'warning', 'Role Restriction');
        setTimeout(() => (window.location.href = 'seeker-dashboard.html'), 1000);
        return;
      }

      // Pre-fill employer company name
      if (user.companyName) {
        document.getElementById('jobCompany').value = user.companyName;
      }

      // Set min date for deadline as tomorrow
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const yyyy = tomorrow.getFullYear();
      const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
      const dd = String(tomorrow.getDate()).padStart(2, '0');
      document.getElementById('jobDeadline').min = `${yyyy}-${mm}-${dd}`;

      // Set default deadline 30 days from today
      const future30 = new Date();
      future30.setDate(future30.getDate() + 30);
      document.getElementById('jobDeadline').value = future30.toISOString().split('T')[0];

      // Form submit handler
      document.getElementById('postJobForm').onsubmit = async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('publishJobSubmitBtn');

        const title = document.getElementById('jobTitle').value.trim();
        const category = document.getElementById('jobCategory').value;
        const company = document.getElementById('jobCompany').value.trim();
        const location = document.getElementById('jobLocation').value.trim();
        const workMode = document.getElementById('jobWorkMode').value;
        const jobType = document.getElementById('jobType').value;
        const experienceLevel = document.getElementById('jobExperience').value;
        const salaryMin = document.getElementById('jobSalaryMin').value;
        const salaryMax = document.getElementById('jobSalaryMax').value;
        const applicationDeadline = document.getElementById('jobDeadline').value;
        const skills = document.getElementById('jobSkills').value;
        const description = document.getElementById('jobDescription').value.trim();
        const responsibilities = document.getElementById('jobResponsibilities').value;
        const requirements = document.getElementById('jobRequirements').value;

        if (!title || !category || !location || !applicationDeadline || !description) {
          UI.showToast('Please fill out all required fields.', 'warning');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner"></span> Publishing...`;

        try {
          const res = await API.createJob({
            title,
            category,
            company,
            location,
            workMode,
            jobType,
            experienceLevel,
            salaryMin,
            salaryMax,
            applicationDeadline,
            skills,
            description,
            responsibilities,
            requirements
          });

          UI.showToast('Job listing published successfully!', 'success', 'Published');
          setTimeout(() => {
            window.location.href = 'employer-dashboard.html';
          }, 800);
        } catch (err) {
          UI.showToast(err.message, 'error', 'Publish Failed');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Publish Job';
        }
      };
    });
  </script>
</body>
</html>
